<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OK homework</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Posts</h1>
<button id="load-posts">Load posts</button>
<div id="posts"></div>
<form id="post-form">
    <h2>Create Post</h2>
    <label for="post-title">
        <input type="text" id="post-title" placeholder="Title">
    </label>
    <label for="post-text">
        <textarea id="post-text" placeholder="Content"></textarea>
    </label>
    <p id="post-tips"></p>
    <button type="submit" id="submit-post">Send</button>
</form>
<script src="script.js"></script>
</body>
</html>
